<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- Sets data-theme before first paint so navigating between pages doesn't flash light-mode white -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('trackph-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) {}
        })();
    </script>
    <title th:text="${pageTitle} + ' | ' + (${appName} ?: 'TrackPH')">TrackPH</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>
    <script th:src="@{/js/theme-toggle.js}"></script>
    <th:block th:replace="${extraHead} ?: ~{}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2L2 8v2h20V8L12 2z" fill="currentColor"/>
            <rect x="4" y="11" width="2.5" height="9" fill="currentColor"/>
            <rect x="10.75" y="11" width="2.5" height="9" fill="currentColor"/>
            <rect x="17.5" y="11" width="2.5" height="9" fill="currentColor"/>
            <rect x="2" y="21" width="20" height="1.5" fill="currentColor"/>
        </svg>TrackPH
    </a>
    <ul class="navbar-links" th:replace="~{fragments/nav :: links}"></ul>
    <button id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()">☾ Dark</button>
</nav>

<div class="page-container">
    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

    <!-- Page content injected here -->
    <th:block th:replace="${content}"/>
</div>

<footer class="footer">
    <span th:text="'TrackPH © 2025, ' + (${appTagline} ?: 'Government Project Monitoring Platform')">TrackPH &copy; 2025, Government Project Monitoring Platform</span>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', initTheme);
</script>
<th:block th:replace="${extraScript} ?: ~{}"/>
</body>
</html>
