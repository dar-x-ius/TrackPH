<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- Sets data-theme before first paint so navigating between pages doesn't flash light-mode white -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('trackph-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) {}
        })();
    </script>
    <title th:text="${pageTitle} + ' | ' + (${appName} ?: 'TrackPH')">TrackPH</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>
    <script th:src="@{/js/theme-toggle.js}"></script>
    <th:block th:replace="${extraHead} ?: ~{}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2L2 8v2h20V8L12 2z" fill="currentColor"/>
            <rect x="4" y="11" width="2.5" height="9" fill="currentColor"/>
            <rect x="10.75" y="11" width="2.5" height="9" fill="currentColor"/>
            <rect x="17.5" y="11" width="2.5" height="9" fill="currentColor"/>
            <rect x="2" y="21" width="20" height="1.5" fill="currentColor"/>
        </svg>TrackPH
    </a>
    <button id="nav-toggle-btn" class="nav-toggle" type="button" onclick="toggleNavMenu()" aria-label="Toggle menu" aria-expanded="false">
        <svg id="nav-icon-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg id="nav-icon-close" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <ul class="navbar-links" th:replace="~{fragments/nav :: links}"></ul>
    <div class="navbar-right">
        <ul class="navbar-user-list" th:replace="~{fragments/nav :: userMenu}"></ul>
        <button id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg id="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
    </div>
</nav>

<!-- .navbar is fixed; .app-scroll owns the actual page scrolling so the scrollbar doesn't run behind it -->
<div class="app-scroll">
    <div class="page-container">
        <!-- Flash messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

        <!-- Page content injected here -->
        <th:block th:replace="${content}"/>
    </div>

    <footer class="footer">
        <span th:text="'TrackPH © 2025, ' + (${appTagline} ?: 'Government Project Monitoring Platform')">TrackPH &copy; 2025, Government Project Monitoring Platform</span>
    </footer>
</div>

<script>
    function toggleNavMenu() {
        const open = document.querySelector('.navbar').classList.toggle('nav-open');
        document.getElementById('nav-toggle-btn').setAttribute('aria-expanded', open ? 'true' : 'false');
        document.getElementById('nav-icon-open').style.display = open ? 'none' : '';
        document.getElementById('nav-icon-close').style.display = open ? '' : 'none';
    }

    document.addEventListener('DOMContentLoaded', function () {
        initTheme();
        const usernameEl = document.getElementById('navbar-username');
        const roleEl = document.getElementById('navbar-role');
        if (usernameEl && roleEl) {
            usernameEl.textContent = localStorage.getItem('trackph-username') || '';
            roleEl.textContent = localStorage.getItem('trackph-role') || '';
        }
    });
</script>
<th:block th:replace="${extraScript} ?: ~{}"/>
</body>
</html>
