<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} + ' | TrackPH'">TrackPH</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>
    <script th:src="@{/js/theme-toggle.js}"></script>
    <th:block th:replace="${extraHead} ?: ~{}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🏛 TrackPH</a>
    <ul class="navbar-links">
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/dashboard}">Dashboard</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/projects}">Projects</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/alerts}">Alerts</a>
        </li>
        <li sec:authorize="hasAnyRole('ADMIN','AGENCY')">
            <a th:href="@{/admin/audit-logs}">Audit Logs</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/auth/logout}">Sign out</a>
        </li>
        <li sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Sign in</a>
        </li>
    </ul>
    <button id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()">☾ Dark</button>
</nav>

<div class="page-container">
    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

    <!-- Page content injected here -->
    <th:block th:replace="${content}"/>
</div>

<footer class="footer">
    <span>TrackPH &copy; 2025 &mdash; Government Project Monitoring Platform</span>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', initTheme);
</script>
<th:block th:replace="${extraScript} ?: ~{}"/>
</body>
</html>
