spring:
  datasource:
    url: jdbc:h2:mem:trackph_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

trackph:
  jwt:
    secret: dev-secret-key-for-local-development-only-32chars
    expiration-ms: 86400000
