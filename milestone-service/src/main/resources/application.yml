spring:
  application:
    name: milestone-service
  datasource:
    url: jdbc:mysql://localhost:3306/trackph_milestone?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  task:
    scheduling:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8081

trackph:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-at-least-32-chars}
    expiration-ms: 86400000
  attachments:
    dir: ${ATTACHMENTS_DIR:./uploads/milestone-attachments}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
