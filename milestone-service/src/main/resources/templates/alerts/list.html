<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Alerts', content=~{::main})}">
<body>
<main>
    <h2 style="color: var(--primary); margin-bottom: 1.5rem;">Alerts</h2>

    <div class="card" style="padding:0; overflow:hidden;">
        <table class="table" id="alerts-table">
            <thead>
                <tr>
                    <th>Severity</th>
                    <th>Type</th>
                    <th>Message</th>
                    <th>Project</th>
                    <th>Triggered</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="alerts-body">
                <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:2rem;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'};

        const sevBadge = { LOW:'badge-secondary', MEDIUM:'badge-warning', HIGH:'badge-danger', CRITICAL:'badge-danger' };

        function loadAlerts() {
            fetch('/api/v1/alerts?size=50&sort=triggeredAt,desc', { headers })
                .then(r => r.json())
                .then(data => {
                    const alerts = data.data?.content ?? [];
                    const tbody = document.getElementById('alerts-body');
                    if (!alerts.length) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:2rem;">No alerts.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = alerts.map(a => `
                        <tr style="${a.read ? '' : 'font-weight:600;'}">
                            <td><span class="badge ${sevBadge[a.severity] || 'badge-secondary'}">${a.severity}</span></td>
                            <td>${a.type.replace(/_/g,' ')}</td>
                            <td>${a.message}</td>
                            <td><a href="/projects/${a.projectId}" style="color:var(--primary);">Project #${a.projectId}</a></td>
                            <td style="font-size:0.8rem; color:var(--text-muted);">${new Date(a.triggeredAt).toLocaleString()}</td>
                            <td>${a.read ? '' : `<button class="btn btn-secondary btn-sm" onclick="markRead(${a.id})">Mark read</button>`}</td>
                        </tr>
                    `).join('');
                });
        }

        function markRead(id) {
            fetch(`/api/v1/alerts/${id}/read`, { method:'PUT', headers })
                .then(() => loadAlerts());
        }

        loadAlerts();

        // Live push: new alerts refresh the table immediately instead of waiting for a manual reload
        if (token) {
            const alertStream = new EventSource('/api/v1/alerts/stream?token=' + encodeURIComponent(token));
            alertStream.addEventListener('alert', loadAlerts);
        }
    </script>
</main>
</body>
</html>
