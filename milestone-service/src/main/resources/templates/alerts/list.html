<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Alerts', content=~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2>
            <svg class="page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 3.5-1.2 5.3-2 6.5h16c-.8-1.2-2-3-2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
            Alerts
        </h2>
        <button id="mark-all-btn" class="btn btn-secondary btn-sm" onclick="markAllRead()" disabled style="display:none;">Mark all as read</button>
    </div>

    <div class="card card-table">
        <table class="table" id="alerts-table">
            <thead>
                <tr>
                    <th data-sort="severity">Severity</th>
                    <th data-sort="type">Type</th>
                    <th data-sort="message">Message</th>
                    <th data-sort="projectId">Project</th>
                    <th data-sort="triggeredAt">Triggered</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="alerts-body">
                <tr><td colspan="6"><div class="empty-state">Loading&hellip;</div></td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'} : {};

        const sevBadge = { LOW:'badge-secondary', MEDIUM:'badge-warning', HIGH:'badge-danger', CRITICAL:'badge-danger' };

        let alerts = [];

        function renderAlerts(rows) {
            const tbody = document.getElementById('alerts-body');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>No alerts. You will be notified here when one triggers.</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(a => `
                <tr style="${a.read ? '' : 'font-weight:600;'}">
                    <td><span class="badge ${sevBadge[a.severity] || 'badge-secondary'}">${a.severity}</span></td>
                    <td>${a.type.replace(/_/g,' ')}</td>
                    <td>${a.message}</td>
                    <td><a href="/projects/${a.projectId}" ${(token && !a.read) ? `onclick="markReadOnNavigate(${a.id})"` : ''}>Project #${a.projectId}</a></td>
                    <td class="text-sm text-muted">${new Date(a.triggeredAt).toLocaleString()}</td>
                    <td>${(token && !a.read) ? `<button class="btn btn-secondary btn-sm" onclick="markRead(${a.id})">Mark read</button>` : ''}</td>
                </tr>
            `).join('');
        }

        function loadAlerts() {
            fetch('/api/v1/alerts?size=50&sort=triggeredAt,desc', { headers })
                .then(r => r.json())
                .then(data => {
                    alerts = data.data?.content ?? [];
                    const markAllBtn = document.getElementById('mark-all-btn');
                    markAllBtn.style.display = token ? 'inline-block' : 'none';
                    markAllBtn.disabled = !alerts.some(a => !a.read);
                    renderAlerts(alerts);
                });
        }

        function markRead(id) {
            fetch(`/api/v1/alerts/${id}/read`, { method:'PUT', headers })
                .then(() => loadAlerts())
                .then(refreshNavBadge);
        }

        // keepalive lets this PUT finish even though the click also navigates away immediately after
        function markReadOnNavigate(id) {
            fetch(`/api/v1/alerts/${id}/read`, { method:'PUT', headers, keepalive: true });
        }

        function markAllRead() {
            fetch('/api/v1/alerts/read-all', { method:'PUT', headers })
                .then(() => loadAlerts())
                .then(refreshNavBadge);
        }

        function refreshNavBadge() {
            fetch('/api/v1/alerts/unread-count', { headers })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    const badge = document.getElementById('unread-badge');
                    const count = data?.data?.count ?? 0;
                    if (!badge) return;
                    badge.textContent = count;
                    badge.style.display = count > 0 ? 'inline' : 'none';
                })
                .catch(() => {});
        }

        loadAlerts();
        makeSortable(document.getElementById('alerts-table'), () => alerts, renderAlerts);

        // Live push: new alerts refresh the table immediately instead of waiting for a manual reload
        if (token) {
            const alertStream = new EventSource('/api/v1/alerts/stream?token=' + encodeURIComponent(token));
            alertStream.addEventListener('alert', loadAlerts);
        }
    </script>
</main>
</body>
</html>
