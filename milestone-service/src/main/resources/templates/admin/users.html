<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Users', content=~{::main})}">
<body>
<main>
    <div class="page-header"><h2>Users</h2></div>

    <div class="card" style="max-width:600px;">
        <h3 style="margin-top:0;">Create Account</h3>
        <form id="create-user-form">
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input id="username" type="text" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input id="email" type="email" class="form-control" required/>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input id="fullName" type="text" class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Agency / Organization</label>
                    <input id="agencyName" type="text" class="form-control"/>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-control">
                        <option value="AGENCY" selected>Agency</option>
                        <option value="ADMIN">Admin</option>
                        <option value="PUBLIC">Public</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Temporary Password</label>
                    <input id="password" type="password" class="form-control" required minlength="8"/>
                </div>
            </div>
            <div id="create-error" class="alert alert-danger" style="display:none;"></div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
    </div>

    <div class="card card-table" style="margin-top:1.5rem;">
        <table class="table" id="users-table">
            <thead>
                <tr>
                    <th data-sort="username">Username</th>
                    <th data-sort="fullName">Full Name</th>
                    <th data-sort="agencyName">Agency</th>
                    <th data-sort="role">Role</th>
                    <th data-sort="active">Status</th>
                    <th data-sort="createdAt">Created</th>
                </tr>
            </thead>
            <tbody id="users-body">
                <tr><td colspan="6"><div class="empty-state">Loading&hellip;</div></td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};
        const ROLE_BADGE = { ADMIN: 'badge-danger', AGENCY: 'badge-info', PUBLIC: 'badge-secondary' };

        let users = [];
        let sortBound = false;

        function renderUsers(rows) {
            const tbody = document.getElementById('users-body');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>No users yet.</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.fullName ?? '—'}</td>
                    <td>${u.agencyName ?? '—'}</td>
                    <td><span class="badge ${ROLE_BADGE[u.role] ?? 'badge-secondary'}">${u.role}</span></td>
                    <td>${u.active ? 'Active' : 'Disabled'}</td>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${new Date(u.createdAt).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function loadUsers() {
            fetch('/api/v1/admin/users', { headers })
                .then(r => r.json())
                .then(data => {
                    users = data.data ?? [];
                    renderUsers(users);
                    // loadUsers() also runs after creating an account — only bind sorting once,
                    // or every refresh would stack another click listener on the same headers.
                    if (!sortBound) {
                        makeSortable(document.getElementById('users-table'), () => users, renderUsers);
                        sortBound = true;
                    }
                });
        }

        document.getElementById('create-user-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const errorEl = document.getElementById('create-error');
            errorEl.style.display = 'none';

            fetch('/api/v1/admin/users', {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    fullName: document.getElementById('fullName').value,
                    agencyName: document.getElementById('agencyName').value,
                    role: document.getElementById('role').value,
                    password: document.getElementById('password').value
                })
            })
                .then(r => r.json().then(body => ({ ok: r.ok, body })))
                .then(({ ok, body }) => {
                    if (!ok) throw new Error(body.message || 'Failed to create account');
                    document.getElementById('create-user-form').reset();
                    loadUsers();
                })
                .catch(err => {
                    errorEl.textContent = err.message;
                    errorEl.style.display = 'block';
                });
        });

        loadUsers();
    </script>
</main>
</body>
</html>
