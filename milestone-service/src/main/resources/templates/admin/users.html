<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Users', content=~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2>
            <svg class="page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6"/></svg>
            Users
        </h2>
        <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm">+ Create Account</a>
    </div>

    <div class="filter-bar">
        <button id="toggle-filter" class="btn btn-secondary btn-sm"></button>
    </div>

    <div class="card card-table">
        <table class="table" id="users-table">
            <thead>
                <tr>
                    <th data-sort="username">Username</th>
                    <th data-sort="fullName">Full Name</th>
                    <th data-sort="agencyName">Agency</th>
                    <th data-sort="role">Role</th>
                    <th data-sort="active">Status</th>
                    <th data-sort="createdAt">Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="users-body">
                <tr><td colspan="7"><div class="empty-state">Loading&hellip;</div></td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};
        const ROLE_BADGE = { ADMIN: 'badge-danger', AGENCY: 'badge-info', PUBLIC: 'badge-secondary' };

        // Staff (ADMIN/AGENCY) by default — that list stays small even as the citizen userbase
        // grows, since PUBLIC is where most future accounts will land. Toggle button swaps to it.
        let showingCitizens = false;
        let users = [];
        let sortBound = false;

        function updateToggleLabel() {
            document.getElementById('toggle-filter').textContent = showingCitizens ? 'Show Staff Accounts' : 'Show Citizen Accounts';
        }

        function renderUsers(rows) {
            const tbody = document.getElementById('users-body');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>No accounts here.</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.fullName ?? '—'}</td>
                    <td>${u.agencyName ?? '—'}</td>
                    <td><span class="badge ${ROLE_BADGE[u.role] ?? 'badge-secondary'}">${u.role}</span></td>
                    <td>${u.active ? 'Active' : 'Disabled'}</td>
                    <td class="text-sm text-muted">${new Date(u.createdAt).toLocaleDateString()}</td>
                    <td>${u.role === 'ADMIN' ? '—' : `
                        <div class="flex gap-2">
                            <button class="btn btn-secondary btn-sm" onclick="resetPassword(${u.id})">Reset Password</button>
                            <button class="btn btn-secondary btn-sm" onclick="toggleActive(${u.id}, ${!u.active})">${u.active ? 'Deactivate' : 'Activate'}</button>
                        </div>
                    `}</td>
                </tr>
            `).join('');
        }

        function resetPassword(id) {
            const newPassword = prompt('New temporary password (min 8 characters):');
            if (!newPassword) return;
            fetch(`/api/v1/admin/users/${id}/password`, {
                method: 'PATCH',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword })
            })
                .then(r => r.json().then(body => ({ ok: r.ok, body })))
                .then(({ ok, body }) => {
                    if (!ok) throw new Error(body.message || 'Failed to reset password');
                    alert('Password reset.');
                })
                .catch(err => alert(err.message));
        }

        function toggleActive(id, active) {
            if (!confirm(active ? 'Reactivate this account?' : 'Deactivate this account? They will not be able to sign in.')) return;
            fetch(`/api/v1/admin/users/${id}/active?active=${active}`, { method: 'PATCH', headers })
                .then(r => r.json().then(body => ({ ok: r.ok, body })))
                .then(({ ok, body }) => {
                    if (!ok) throw new Error(body.message || 'Failed to update account');
                    loadUsers();
                })
                .catch(err => alert(err.message));
        }

        function loadUsers() {
            const query = showingCitizens ? '?roles=PUBLIC' : '';
            fetch(`/api/v1/admin/users${query}`, { headers })
                .then(r => r.json())
                .then(data => {
                    users = data.data ?? [];
                    renderUsers(users);
                    // Sorting only needs binding once — the click handler reads `users` live,
                    // so a toggle-triggered reload doesn't need a rebind.
                    if (!sortBound) {
                        makeSortable(document.getElementById('users-table'), () => users, renderUsers);
                        sortBound = true;
                    }
                });
        }

        document.getElementById('toggle-filter').addEventListener('click', function () {
            showingCitizens = !showingCitizens;
            updateToggleLabel();
            loadUsers();
        });

        updateToggleLabel();
        loadUsers();
    </script>
</main>
</body>
</html>
