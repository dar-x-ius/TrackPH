<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Create Account', content=~{::main})}">
<body>
<main>
    <div class="page-header"><h2>Create Account</h2></div>

    <div style="max-width: 620px; margin: 0.75rem auto;">
        <div class="card">
            <p style="margin:0 0 1rem; font-size:0.9rem; color: var(--text-muted);">Provision a staff or agency account. The person signs in with this username and temporary password.</p>
            <form id="create-user-form">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input id="username" type="text" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input id="email" type="email" class="form-control" required/>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input id="fullName" type="text" class="form-control"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Agency / Organization</label>
                        <input id="agencyName" type="text" class="form-control"/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-control">
                        <option value="AGENCY" selected>Agency</option>
                        <option value="ADMIN">Admin</option>
                        <option value="PUBLIC">Public</option>
                    </select>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Temporary Password</label>
                        <div class="password-field">
                            <input id="password" type="password" class="form-control" required minlength="8"/>
                            <button type="button" class="password-toggle" data-target="password">Show</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <div class="password-field">
                            <input id="confirmPassword" type="password" class="form-control" required minlength="8"/>
                            <button type="button" class="password-toggle" data-target="confirmPassword">Show</button>
                        </div>
                    </div>
                </div>
                <div id="create-error" class="alert alert-danger" style="display:none;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};

        document.querySelectorAll('.password-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const input = document.getElementById(btn.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? 'Hide' : 'Show';
            });
        });

        document.getElementById('create-user-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const errorEl = document.getElementById('create-error');
            errorEl.style.display = 'none';

            if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            fetch('/api/v1/admin/users', {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    fullName: document.getElementById('fullName').value,
                    agencyName: document.getElementById('agencyName').value,
                    role: document.getElementById('role').value,
                    password: document.getElementById('password').value
                })
            })
                .then(r => r.json().then(body => ({ ok: r.ok, body })))
                .then(({ ok, body }) => {
                    if (!ok) throw new Error(body.message || 'Failed to create account');
                    window.location.href = '/admin/users';
                })
                .catch(err => {
                    errorEl.textContent = err.message;
                    errorEl.style.display = 'block';
                });
        });
    </script>
</main>
</body>
</html>
