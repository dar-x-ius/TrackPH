<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Audit Logs', content=~{::main})}">
<body>
<main>
    <div class="page-header"><h2>Audit Logs</h2></div>

    <div class="card card-table">
        <table class="table" id="audit-table">
            <thead>
                <tr>
                    <th data-sort="createdAt">Time</th>
                    <th data-sort="username">User</th>
                    <th data-sort="action">Action</th>
                    <th data-sort="entityType">Entity</th>
                    <th>What changed</th>
                    <th data-sort="ipAddress">IP</th>
                </tr>
            </thead>
            <tbody id="audit-body">
                <tr><td colspan="6"><div class="empty-state">Loading&hellip;</div></td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};

        let logs = [];

        const ROUTE_LABELS = [
            [/\/alerts\/\d+\/read$/, 'Marked an alert read'],
            [/\/alerts\/read-all$/, 'Marked all alerts read'],
            [/\/dashboard\/settings$/, 'Updated dashboard settings'],
            [/\/attachments\/\d+\/restore$/, 'Restored an attachment'],
            [/\/attachments\/\d+$/, 'Removed an attachment'],
            [/\/attachments$/, 'Uploaded an attachment'],
            [/\/restore$/, 'Restored a record']
        ];

        /** Technical `action` (e.g. "PUT /api/v1/milestones/42") means nothing to a non-technical reader, so turn it into a sentence. Falls back to a route-pattern guess for actions with no entityType (alerts, dashboard settings) — the raw string is still shown as a tooltip for anyone who needs it. */
        function renderAction(log) {
            let parsed = null;
            try { parsed = log.details ? JSON.parse(log.details) : null; } catch (e) { /* malformed details, fall through to route guess */ }
            let label;
            if (log.entityType) {
                const verb = parsed?.deleted ? 'Deleted' : (parsed && parsed.before === null) ? 'Created' : 'Updated';
                label = `${verb} ${log.entityType}${log.entityId != null ? ' #' + log.entityId : ''}`;
            } else {
                const path = log.action.split(' ')[1] || '';
                const match = ROUTE_LABELS.find(([re]) => re.test(path));
                label = match ? match[1] : log.action;
            }
            return `<span title="${log.action}">${label}</span>`;
        }

        function renderChanges(details) {
            if (!details) return '—';
            let parsed;
            try { parsed = JSON.parse(details); } catch (e) { return '—'; }
            const badge = parsed.deleted ? 'badge-danger' : (parsed.before === null ? 'badge-success' : 'badge-info');
            const label = parsed.deleted ? 'Removed' : (parsed.before === null ? 'Created' : 'Changed');
            const body = parsed.deleted ?? { before: parsed.before, after: parsed.after };
            return `
                <details>
                    <summary class="badge ${badge}" style="cursor:pointer;">${label}</summary>
                    <pre style="font-size:0.75rem; max-width:360px; white-space:pre-wrap; margin:0.4rem 0 0;">${JSON.stringify(body, null, 2)}</pre>
                </details>
            `;
        }

        function renderLogs(rows) {
            const tbody = document.getElementById('audit-body');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>No logs yet.</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(l => `
                <tr>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${new Date(l.createdAt).toLocaleString()}</td>
                    <td>${l.username ?? '—'}</td>
                    <td style="font-size:0.85rem;">${renderAction(l)}</td>
                    <td style="font-size:0.85rem;">${l.entityType ? l.entityType + ' #' + l.entityId : '—'}</td>
                    <td>${renderChanges(l.details)}</td>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${l.ipAddress ?? '—'}</td>
                </tr>
            `).join('');
        }

        fetch('/api/v1/audit-logs?size=100&sort=createdAt,desc', { headers })
            .then(r => r.json())
            .then(data => {
                logs = data.data?.content ?? [];
                renderLogs(logs);
                makeSortable(document.getElementById('audit-table'), () => logs, renderLogs);
            });
    </script>
</main>
</body>
</html>
