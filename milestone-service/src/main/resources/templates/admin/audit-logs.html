<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Audit Logs', content=~{::main})}">
<body>
<main>
    <div class="page-header"><h2>Audit Logs</h2></div>

    <div class="card card-table">
        <table class="table" id="audit-table">
            <thead>
                <tr>
                    <th data-sort="createdAt">Time</th>
                    <th data-sort="username">User</th>
                    <th data-sort="action">Action</th>
                    <th data-sort="entityType">Entity</th>
                    <th>What changed</th>
                    <th data-sort="ipAddress">IP</th>
                </tr>
            </thead>
            <tbody id="audit-body">
                <tr><td colspan="6"><div class="empty-state">Loading&hellip;</div></td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};

        let logs = [];

        const ROUTE_LABELS = [
            [/\/auth\/login$/, 'Signed in'],
            [/\/auth\/register$/, 'Created an account'],
            [/\/alerts\/\d+\/read$/, 'Marked an alert read'],
            [/\/alerts\/read-all$/, 'Marked all alerts read'],
            [/\/dashboard\/settings$/, 'Updated dashboard settings'],
            [/\/milestones\/\d+\/report$/, 'Submitted a milestone report'],
            [/\/attachments\/\d+\/restore$/, 'Restored an attachment'],
            [/\/attachments\/\d+$/, 'Removed an attachment'],
            [/\/attachments$/, 'Uploaded an attachment'],
            [/\/restore$/, 'Restored a record']
        ];

        /** Last-resort label for a route nothing above recognizes (old rows logged before this entity wired up AuditContext, or a future endpoint nobody's mapped yet) — "DELETE /api/v1/projects/14" becomes "Deleted project", never raw. */
        function humanizeRoute(method, path) {
            const VERBS = { POST: 'Created', PUT: 'Updated', PATCH: 'Updated', DELETE: 'Deleted' };
            const segments = path.replace(/^\/api\/v1\//, '').split('/').filter(s => s && !/^\d+$/.test(s));
            const noun = (segments[segments.length - 1] || 'record').replace(/s$/, '');
            return `${VERBS[method] || method} ${noun}`;
        }

        /** Technical `action` (e.g. "PUT /api/v1/milestones/42") means nothing to a non-technical reader, so turn it into a sentence. Falls back to a route-pattern guess, then a generic humanizer, for actions with no entityType — the raw string is still shown as a tooltip for anyone who needs it. */
        function renderAction(log) {
            let parsed = null;
            try { parsed = log.details ? JSON.parse(log.details) : null; } catch (e) { /* malformed details, fall through to route guess */ }
            let label;
            if (log.entityType) {
                const verb = parsed?.deleted ? 'Deleted' : (parsed && parsed.before === null) ? 'Created' : 'Updated';
                label = `${verb} ${log.entityType}${log.entityId != null ? ' #' + log.entityId : ''}`;
            } else {
                const [method, path] = log.action.split(' ');
                const match = ROUTE_LABELS.find(([re]) => re.test(path || ''));
                label = match ? match[1] : humanizeRoute(method, path || '');
            }
            return `<span title="${log.action}">${label}</span>`;
        }

        /** Turns a before/after audit snapshot into "Field: old → new" lines instead of a raw JSON dump. */
        function diffLines(before, after) {
            const keys = new Set([...Object.keys(before || {}), ...Object.keys(after || {})]);
            const lines = [];
            keys.forEach(k => {
                if (k === 'id') return;
                const b = before ? before[k] : undefined;
                const a = after ? after[k] : undefined;
                if (JSON.stringify(b) === JSON.stringify(a)) return;
                const label = k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
                lines.push(before ? `${label}: ${formatVal(b)} &rarr; ${formatVal(a)}` : `${label}: ${formatVal(a)}`);
            });
            return lines;
        }

        function formatVal(v) {
            if (v === null || v === undefined || v === '') return '—';
            if (typeof v === 'object') return JSON.stringify(v);
            return String(v);
        }

        function renderChanges(details) {
            if (!details) return '—';
            let parsed;
            try { parsed = JSON.parse(details); } catch (e) { return '—'; }
            const badge = parsed.deleted ? 'badge-danger' : (parsed.before === null ? 'badge-success' : 'badge-info');
            const label = parsed.deleted ? 'Removed' : (parsed.before === null ? 'Created' : 'Changed');
            const lines = diffLines(parsed.deleted ? null : parsed.before, parsed.deleted ?? parsed.after);
            return `
                <details>
                    <summary class="badge ${badge}" style="cursor:pointer;">${label}</summary>
                    <div style="font-size:0.75rem; max-width:360px; margin:0.4rem 0 0;">
                        ${lines.map(l => `<div>${l}</div>`).join('') || '<div style="color:var(--text-muted);">No field changes recorded.</div>'}
                    </div>
                </details>
            `;
        }

        function renderLogs(rows) {
            const tbody = document.getElementById('audit-body');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>No logs yet.</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(l => `
                <tr>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${new Date(l.createdAt).toLocaleString()}</td>
                    <td>${l.username ?? '—'}</td>
                    <td style="font-size:0.85rem;">${renderAction(l)}</td>
                    <td style="font-size:0.85rem;">${l.entityType ? l.entityType + ' #' + l.entityId : '—'}</td>
                    <td>${renderChanges(l.details)}</td>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${l.ipAddress ?? '—'}</td>
                </tr>
            `).join('');
        }

        fetch('/api/v1/audit-logs?size=100&sort=createdAt,desc', { headers })
            .then(r => r.json())
            .then(data => {
                logs = data.data?.content ?? [];
                renderLogs(logs);
                makeSortable(document.getElementById('audit-table'), () => logs, renderLogs);
            });
    </script>
</main>
</body>
</html>
