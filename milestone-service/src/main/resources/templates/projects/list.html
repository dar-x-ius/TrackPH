<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Projects', content=~{::main})}">
<body>
<main>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h2 style="margin:0; color: var(--primary);">Projects</h2>
        <a th:href="@{/projects/new}" class="btn btn-primary btn-sm">+ New Project</a>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
        <table class="table" id="projects-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Agency</th>
                    <th>Status</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Milestones</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="projects-body">
                <tr><td colspan="7" style="text-align:center; color: var(--text-muted); padding:2rem;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};

        const statusBadge = {
            PLANNED: 'badge-secondary', IN_PROGRESS: 'badge-info',
            DELAYED: 'badge-danger', COMPLETED: 'badge-success', CANCELLED: 'badge-secondary'
        };

        fetch('/api/v1/projects?size=50', { headers })
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('projects-body');
                const projects = data.data?.content ?? [];
                if (!projects.length) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:2rem;">No projects found.</td></tr>';
                    return;
                }
                tbody.innerHTML = projects.map(p => `
                    <tr>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.agencyName ?? '—'}</td>
                        <td><span class="badge ${statusBadge[p.status] || 'badge-secondary'}">${p.status}</span></td>
                        <td>${p.startDate ?? '—'}</td>
                        <td>${p.endDate ?? '—'}</td>
                        <td>${p.milestoneCount}</td>
                        <td><a href="/projects/${p.id}" class="btn btn-secondary btn-sm">View</a></td>
                    </tr>
                `).join('');
            });
    </script>
</main>
</body>
</html>
