<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Archived Projects', content=~{::main})}">
<body>
<main>
    <a th:href="@{/projects}" class="back-link">&larr; Back to Projects</a>

    <div class="page-header">
        <h2>Archived Projects</h2>
    </div>
    <p style="color: var(--text-muted); margin-top: -0.5rem;">
        Projects an agency or admin has deleted. Deleting never erases the record — this is the public
        trail of what was removed, by whom, and when.
    </p>

    <div class="card card-table">
        <table class="table" id="archived-table">
            <thead>
                <tr><th data-sort="name">Name</th><th data-sort="status">Status</th><th data-sort="deletedAt">Deleted</th><th></th></tr>
            </thead>
            <tbody id="archived-body">
                <tr><td colspan="4"><div class="empty-state">Loading&hellip;</div></td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const role = localStorage.getItem('trackph-role') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};

        const statusBadge = {
            PLANNED: 'badge-secondary', IN_PROGRESS: 'badge-info',
            DELAYED: 'badge-danger', COMPLETED: 'badge-success', CANCELLED: 'badge-secondary'
        };

        let archivedProjects = [];

        function renderArchived(rows) {
            const tbody = document.getElementById('archived-body');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><p>Nothing archived.</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(p => `
                <tr>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="badge ${statusBadge[p.status] || 'badge-secondary'}">${p.status}</span></td>
                    <td>${p.deletedAt ?? '—'}</td>
                    <td>${role === 'ADMIN' ? `<button class="btn btn-secondary btn-sm" onclick="restoreProject(${p.id})">Restore</button>` : ''}</td>
                </tr>
            `).join('');
        }

        function loadArchived() {
            fetch('/api/v1/projects/archived', { headers })
                .then(r => r.json())
                .then(data => {
                    archivedProjects = data.data ?? [];
                    renderArchived(archivedProjects);
                });
        }

        function restoreProject(id) {
            if (!confirm('Restore this project along with its milestones and attachments?')) return;
            fetch(`/api/v1/projects/${id}/restore`, { method: 'POST', headers })
                .then(r => r.json().then(body => ({ ok: r.ok, body })))
                .then(({ ok, body }) => {
                    if (!ok) throw new Error(body.message || 'Failed to restore project');
                    loadArchived();
                })
                .catch(err => alert(err.message));
        }

        loadArchived();
        makeSortable(document.getElementById('archived-table'), () => archivedProjects, renderArchived);
    </script>
</main>
</body>
</html>
