<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='New Project', content=~{::main})}">
<body>
<main>
    <div class="page-header"><h2>New Project</h2></div>

    <div class="card" style="max-width:600px;">
        <form id="new-project-form">
            <div class="form-group">
                <label class="form-label" for="name">Name</label>
                <input type="text" id="name" class="form-control" required/>
            </div>
            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label" for="location">Location</label>
                <input type="text" id="location" class="form-control"/>
            </div>
            <div class="form-group">
                <label class="form-label">Pin on Map (optional &mdash; leave blank to auto-locate from the text above)</label>
                <div id="location-picker" style="height:220px; border-radius:var(--radius); background:var(--surface-raised);"></div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="startDate">Start Date</label>
                    <input type="date" id="startDate" class="form-control"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="endDate">End Date</label>
                    <input type="date" id="endDate" class="form-control"/>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="budget">Budget</label>
                <input type="number" id="budget" class="form-control" step="0.01"/>
            </div>
            <div id="error" class="alert alert-danger" style="display:none;"></div>
            <button type="submit" class="btn btn-primary">Create Project</button>
        </form>
    </div>

    <script>
        let pickedLat = null, pickedLng = null;
        TrackPHMaps.initPinPicker('location-picker', null, (lat, lng) => { pickedLat = lat; pickedLng = lng; });

        document.getElementById('new-project-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const token = localStorage.getItem('trackph-token') || '';
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';

            fetch('/api/v1/projects', {
                method: 'POST',
                headers: token
                    ? {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}
                    : {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    description: document.getElementById('description').value,
                    location: document.getElementById('location').value,
                    latitude: pickedLat,
                    longitude: pickedLng,
                    startDate: document.getElementById('startDate').value || null,
                    endDate: document.getElementById('endDate').value || null,
                    budget: document.getElementById('budget').value || null
                })
            })
                .then(r => r.json().then(body => ({ ok: r.ok, body })))
                .then(({ ok, body }) => {
                    if (!ok) throw new Error(body.message || 'Failed to create project');
                    window.location.href = '/projects/' + body.data.id;
                })
                .catch(err => {
                    errorEl.textContent = err.message;
                    errorEl.style.display = 'block';
                });
        });
    </script>
</main>
</body>
</html>
