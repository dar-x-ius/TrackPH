<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Dashboard', content=~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2>
            <svg class="page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
            Dashboard
        </h2>
    </div>

    <div class="stats-row">
        <div class="stat-tile stat-primary">
            <div class="stat-value" id="stat-total">&mdash;</div>
            <div class="stat-label">Total Projects</div>
        </div>
        <div class="stat-tile stat-info">
            <div class="stat-value" id="stat-inprogress">&mdash;</div>
            <div class="stat-label">In Progress</div>
        </div>
        <div class="stat-tile stat-danger">
            <div class="stat-value" id="stat-delayed">&mdash;</div>
            <div class="stat-label">Delayed</div>
        </div>
        <div class="stat-tile stat-warning">
            <div class="stat-value" id="stat-alerts">&mdash;</div>
            <div class="stat-label">Unread Alerts</div>
        </div>
    </div>

    <div class="grid-2">
        <div>
            <h3 class="mt-0">Quick Links</h3>
            <div class="card flex gap-2">
                <a th:href="@{/projects}" class="btn btn-primary btn-sm">View Projects</a>
                <a th:href="@{/alerts}" class="btn btn-secondary btn-sm">View Alerts</a>
            </div>
        </div>
        <div>
            <h3 class="mt-0">System Status</h3>
            <div class="card">
                <p class="mt-0 mb-0 text-muted text-sm">
                    Milestone alert scan runs daily at midnight.<br/>
                    All user actions are automatically logged.
                </p>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('trackph-token') || '';
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};

        fetch('/api/v1/dashboard', { headers })
            .then(r => r.json())
            .then(data => {
                if (data.status !== 'success') return;
                const d = data.data;
                document.getElementById('stat-total').textContent      = d.totalProjects;
                document.getElementById('stat-inprogress').textContent = d.inProgressProjects;
                document.getElementById('stat-delayed').textContent    = d.delayedProjects;
                document.getElementById('stat-alerts').textContent     = d.unreadAlerts;
            });
    </script>
</main>
</body>
</html>
