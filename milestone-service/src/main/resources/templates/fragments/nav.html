<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<ul class="navbar-links" th:fragment="links">
    <li sec:authorize="isAuthenticated()"><a th:href="@{/dashboard}">Dashboard</a></li>
    <li sec:authorize="isAuthenticated()"><a th:href="@{/projects}">Projects</a></li>
    <li sec:authorize="isAuthenticated()"><a th:href="@{/alerts}">
        Alerts
        <span id="unread-badge" class="nav-badge"></span>
    </a></li>
    <li sec:authorize="hasAnyRole('ADMIN','AGENCY')"><a th:href="@{/admin/audit-logs}">Audit Logs</a></li>
</ul>
<ul class="navbar-user-list" th:fragment="userMenu">
    <li sec:authorize="isAuthenticated()" class="navbar-user" id="navbar-user">
        <span id="navbar-username"></span><span id="navbar-role" class="badge badge-secondary"></span>
    </li>
    <li sec:authorize="isAuthenticated()"><a th:href="@{/auth/logout}" class="nav-action" onclick="localStorage.removeItem('trackph-token'); localStorage.removeItem('trackph-username'); localStorage.removeItem('trackph-role')">Sign out</a></li>
    <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}" class="nav-action">Sign in</a></li>
</ul>
</body>
</html>
