<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} + ' | TrackPH Milestones'">TrackPH</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>
    <script th:src="@{/js/theme-toggle.js}"></script>
    <th:block th:replace="${extraHead} ?: ~{}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🏛 TrackPH</a>
    <ul class="navbar-links">
        <li sec:authorize="isAuthenticated()"><a th:href="@{/dashboard}">Dashboard</a></li>
        <li sec:authorize="isAuthenticated()"><a th:href="@{/projects}">Projects</a></li>
        <li sec:authorize="isAuthenticated()"><a th:href="@{/alerts}">
            Alerts
            <span id="unread-badge" style="background:var(--primary-light);color:#fff;border-radius:999px;padding:1px 7px;font-size:0.75rem;margin-left:4px;display:none;"></span>
        </a></li>
        <li sec:authorize="hasAnyRole('ADMIN','AGENCY')"><a th:href="@{/admin/audit-logs}">Audit Logs</a></li>
        <li sec:authorize="isAuthenticated()"><a th:href="@{/auth/logout}" onclick="localStorage.removeItem('trackph-token')">Sign out</a></li>
        <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Sign in</a></li>
    </ul>
    <button id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()">☾ Dark</button>
</nav>

<div class="page-container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

    <th:block th:replace="${content}"/>
</div>

<footer class="footer">
    <span>TrackPH &copy; 2025 &mdash; Milestone &amp; Timeline Monitoring</span>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        initTheme();
        const token = localStorage.getItem('trackph-token') || '';
        // Poll unread count every 60s for authenticated users (and once more right away on any pushed alert)
        function refreshUnread() {
            fetch('/api/v1/alerts/unread-count', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    const badge = document.getElementById('unread-badge');
                    const count = data.data?.count ?? 0;
                    if (badge) {
                        badge.textContent = count;
                        badge.style.display = count > 0 ? 'inline' : 'none';
                    }
                }).catch(() => {});
        }
        refreshUnread();
        setInterval(refreshUnread, 60000);

        // Live push: new alerts refresh the badge immediately instead of waiting for the next poll
        if (token) {
            const alertStream = new EventSource('/api/v1/alerts/stream?token=' + encodeURIComponent(token));
            alertStream.addEventListener('alert', refreshUnread);
        }
    });
</script>
<th:block th:replace="${extraScript} ?: ~{}"/>
</body>
</html>
