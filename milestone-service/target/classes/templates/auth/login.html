<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Sign In', content=~{::main})}">
<body>
<main>
    <div style="max-width: 400px; margin: 3rem auto;">
        <div class="card">
            <h2 style="margin-top:0; color: var(--primary);">Sign In</h2>

            <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-success">You have been signed out.</div>

            <form th:action="@{/auth/login-form}" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input id="username" name="username" type="text" class="form-control"
                           autocomplete="username" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control"
                           autocomplete="current-password" required/>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Sign In</button>
            </form>
            <p style="text-align:center; margin-top:1rem; font-size:0.9rem; color: var(--text-muted);">
                No account? <a th:href="@{/register}">Register</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
